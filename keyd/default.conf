[ids]
*

[global]
# 2回押し判定: 1回目のタップから 300ms 以内の2回目を拾う
oneshot_timeout = 300
# 200ms 以上押していたら「タップ」扱いしない
overload_tap_timeout = 200

[main]
# ZMK キーボードは Ctrl 位置が leftmeta、Alt が rightalt を送る
leftmeta = overload(meta_mac, oneshot(ctrl_tap))

# 押しっぱなしは通常の Ctrl / Alt、タップすると2回押し待ちレイヤーへ
rightalt = overload(alt, oneshot(alt_tap))

# Esc → Esc の後に F15 (xkb: XF86Launch6) → niri で fcitx5-remote -c (IME を US に戻す)
esc = macro(esc f15)

# Ctrl 2回 → F13 (xkb: XF86Tools)    → niri でクリップボード履歴
[ctrl_tap]
leftcontrol = f13
leftmeta = f13

# Alt 2回  → F14 (xkb: XF86Launch5)  → niri で espanso 検索
[alt_tap]
leftalt = f14
rightalt = f14

[meta_mac:C]
c = C-insert # c = C-S-c
v = S-insert # v = C-S-v 
x = S-delete
z = C-z
S-z = C-S-z

left = home
right = end
up = C-home
down = C-end

# niri設定側でAlt Spaceでlancher起動
# zmk側でlayer + EnterをAlt Spaceにしている
space = A-space
