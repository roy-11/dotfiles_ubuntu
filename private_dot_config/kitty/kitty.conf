# font
font_family JetBrainsMono Nerd Font
# font_family      JetBrains Mono Nerd Font
font_size   10.0

# window
window_padding_width   12
background_opacity     0.50
hide_window_decorations yes

# cursor
# block, underline, beam
# cursor_shape          beam
cursor_blink_interval 0

# selection
copy_on_select clipboard

# keyboard
# ctrl+shift+c / ctrl+shift+v (copy/paste) はデフォルトで有効
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# Cursor
cursor_shape beam
cursor_trail 1

# No stupid close confirmation
confirm_os_window_close 0

map ctrl+c    copy_or_interrupt
map ctrl+shift+y load_config_file

# OSC 52 clipboard access (suppress permission prompt)
clipboard_control write-clipboard write-primary read-clipboard read-primary

# colors (alacritty のデフォルト配色に合わせる)
background #181818
foreground #d8d8d8

# black
color0  #181818
color8  #6b6b6b
# red
color1  #ac4242
color9  #c55555
# green
color2  #90a959
color10 #aac474
# yellow
color3  #f4bf75
color11 #feca88
# blue
color4  #6a9fb5
color12 #82b8c8
# magenta
color5  #aa759f
color13 #c28cb8
# cyan
color6  #75b5aa
color14 #93d3c3
# white
color7  #d8d8d8
color15 #f8f8f8

# >>> herdr-radar font block
symbol_map U+E1A0-U+E1BA Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max
# <<< herdr-radar font block
